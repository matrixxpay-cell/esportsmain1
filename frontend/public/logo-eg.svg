<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B"/>
      <stop offset="100%" stop-color="#E85D00"/>
    </linearGradient>
  </defs>

  <!-- Orange rounded square background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- EG lettermark — centered, bold italic angular style matching the logo -->
  <!-- Translated so the whole EG mark is centered in 512x512 -->
  <!-- EG group: approx 340w x 240h, centered at 256,256 → translate(86, 136) -->
  <g fill="white" transform="translate(78, 130) skewX(-8)">

    <!-- === E === -->
    <!-- Left vertical stroke -->
    <rect x="0" y="0" width="42" height="240" rx="6"/>
    <!-- Top horizontal bar -->
    <rect x="0" y="0" width="155" height="42" rx="6"/>
    <!-- Middle horizontal bar -->
    <rect x="0" y="99" width="130" height="38" rx="6"/>
    <!-- Bottom horizontal bar -->
    <rect x="0" y="198" width="155" height="42" rx="6"/>

    <!-- gap between E and G -->

    <!-- === G === -->
    <!-- Outer arc top bar -->
    <rect x="178" y="0" width="168" height="42" rx="6"/>
    <!-- Right vertical top half -->
    <rect x="304" y="0" width="42" height="145" rx="6"/>
    <!-- Inner notch (G cutout) — middle right bar -->
    <rect x="220" y="99" width="126" height="38" rx="6"/>
    <!-- Bottom bar -->
    <rect x="178" y="198" width="168" height="42" rx="6"/>
    <!-- Left vertical full -->
    <rect x="178" y="0" width="42" height="240" rx="6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8C1A"/>
      <stop offset="45%" stop-color="#CC4400"/>
      <stop offset="100%" stop-color="#7A1A00"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B2B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B2B" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Outer glow -->
  <circle cx="256" cy="256" r="256" fill="url(#glow)"/>

  <!-- Main orb -->
  <circle cx="256" cy="256" r="245" fill="url(#orb)"/>

  <!-- Subtle texture overlay -->
  <circle cx="256" cy="256" r="245" fill="url(#orb)" opacity="0.4" filter="url(#noise)"/>

  <!-- Highlight shine top-left -->
  <ellipse cx="180" cy="160" rx="100" ry="70" fill="white" opacity="0.06"/>

  <!-- EG text — bold italic esports style -->
  <text
    x="256" y="310"
    text-anchor="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="230"
    font-style="italic"
    letter-spacing="-8"
    fill="white"
    stroke="rgba(0,0,0,0.15)"
    stroke-width="4"
  >EG</text>
</svg>
